name: Deploy to VPS

on:
  push:
    branches: [main, master]
  workflow_dispatch:

# Never run two deploys at once; a newer push waits for the running one.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Pull, rebuild and restart over SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.PORT || 22 }}
          command_timeout: 25m
          script: |
            set -euo pipefail
            cd /opt/zarafshon
            git fetch --prune origin
            git reset --hard "origin/${{ github.ref_name }}"
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build --remove-orphans
            docker image prune -f
            # Wait for the site to answer through the frontend (which proxies /api to FastAPI).
            for i in $(seq 1 30); do
              if curl -fsS -o /dev/null http://127.0.0.1:3000/api/health; then
                echo "Deployed $(git rev-parse --short HEAD)"; exit 0
              fi
              sleep 3
            done
            docker compose -f docker-compose.yml -f docker-compose.prod.yml ps
            docker compose -f docker-compose.yml -f docker-compose.prod.yml logs --tail=80 backend frontend
            exit 1
