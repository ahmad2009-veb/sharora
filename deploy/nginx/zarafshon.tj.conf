# Host nginx for the VPS (see docker-compose.prod.yml): TLS ends here, everything is proxied to
# the Next.js container on 127.0.0.1:3000, which forwards /api and /media to FastAPI.
#
# Canonical address: https://zarafshon.tj (the site is built with SITE_URL=https://zarafshon.tj,
# so canonical tags, sitemap.xml and og:image already point there). Every other variant —
# http://, www. — answers with a single 301 straight to it.
#
# Install (see deploy/README.md for the full steps, including DNS and the certificate):
#   sudo cp deploy/nginx/zarafshon.tj.conf /etc/nginx/sites-available/zarafshon.tj
#   sudo ln -sf /etc/nginx/sites-available/zarafshon.tj /etc/nginx/sites-enabled/zarafshon.tj
#   sudo nginx -t && sudo systemctl reload nginx

# http://zarafshon.tj and http://www.zarafshon.tj → https://zarafshon.tj
server {
    listen 80;
    listen [::]:80;
    server_name zarafshon.tj www.zarafshon.tj;

    # Let's Encrypt HTTP-01 renewals (certbot --webroot); harmless with the nginx plugin too.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://zarafshon.tj$request_uri;
    }
}

# https://www.zarafshon.tj → https://zarafshon.tj
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.zarafshon.tj;

    # One certificate covers both names: certbot ... -d zarafshon.tj -d www.zarafshon.tj
    ssl_certificate     /etc/letsencrypt/live/zarafshon.tj/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zarafshon.tj/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://zarafshon.tj$request_uri;
}

# https://zarafshon.tj — the site
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name zarafshon.tj;

    ssl_certificate     /etc/letsencrypt/live/zarafshon.tj/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zarafshon.tj/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Floor-plan / photo uploads from the admin.
    client_max_body_size 20m;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/xml application/json application/javascript image/svg+xml;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 60s;
    }
}

# For the WebSocket/Upgrade header above. If another site on this server already defines
# $connection_upgrade, delete this block (nginx -t reports a duplicate).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
