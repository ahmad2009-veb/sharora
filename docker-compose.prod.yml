# Production overrides for the VPS (zarafshon.tj). Used together with docker-compose.yml:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
# Nginx on the host terminates TLS and proxies everything to the frontend on 127.0.0.1:3000;
# Next.js rewrites /api and /media to the backend over the internal Docker network.
services:
  db:
    restart: unless-stopped

  backend:
    restart: unless-stopped
    environment:
      # nginx (host) → Next.js (container) → FastAPI: both hops are on Docker's private ranges.
      TRUSTED_PROXY_CIDRS: 127.0.0.1/32,::1/128,172.16.0.0/12
    # Not published: only the frontend container talks to the API.
    ports: !reset []

  frontend:
    restart: unless-stopped
    ports: !override
      - "127.0.0.1:3000:3000"
